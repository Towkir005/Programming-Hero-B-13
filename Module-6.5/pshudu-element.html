<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>element</title>
    <style>
        h3::after{
            content:'.pdf';
            color: red;
            font-size: 10px;
            background-color: yellow;
        }

        h3::before{
            content: 'start:';
             color: red;
            font-size: 10px;
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h3>heading-1</h3>
    <h3>heading-2</h3>
    <h3>heading-3</h3>
    
</body>
</html>
